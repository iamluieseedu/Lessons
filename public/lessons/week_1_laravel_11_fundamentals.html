<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1: Laravel 11 Fundamentals (Interactive Developer Edition)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --laravel-red: #EF4444;
            --laravel-red-glow: rgba(239, 68, 68, 0.15);
            --laravel-red-border: rgba(239, 68, 68, 0.3);
            --bg-canvas: #090d16;
            --bg-card: #0f172a;
            --bg-card-overlay: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-accent: #f87171;
            --code-bg: #030712;
            --hover-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #020617;
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Scalable Slide Container */
        .slide-viewport {
            width: 1280px;
            height: 720px;
            background: linear-gradient(145deg, #0f172a 0%, #020617 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transform-origin: center center;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Slide Transition Animations */
        .slide {
            display: none;
            flex-grow: 1;
            padding: 30px 45px;
            height: calc(100% - 110px);
            opacity: 0;
            transform: scale(0.985);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .slide.active {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 1;
            transform: scale(1);
        }

        /* Slide Header */
        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 14px;
            height: 40px;
            flex-shrink: 0;
        }

        .slide-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slide-title i {
            color: var(--laravel-red);
        }

        .module-tag {
            background: var(--laravel-red-glow);
            color: var(--text-accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            border: 1px solid var(--laravel-red-border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Content Areas */
        .content-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 24px;
            flex-grow: 1;
            min-height: 0; /* allows grid children to shrink */
            margin-bottom: 8px;
        }

        .text-card {
            background: var(--bg-card-overlay);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .text-card h3 {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-primary);
            border-left: 4px solid var(--laravel-red);
            padding-left: 10px;
        }

        .text-card p, .text-card li {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .text-card ul {
            padding-left: 20px;
            list-style-type: none;
        }

        .text-card li {
            position: relative;
            margin-bottom: 6px;
        }

        .text-card li::before {
            content: "→";
            color: var(--laravel-red);
            position: absolute;
            left: -20px;
            font-weight: bold;
        }

        /* Callouts */
        .insight-box {
            background: var(--laravel-red-glow);
            border-left: 4px solid var(--laravel-red);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            margin-top: 8px;
        }

        .insight-box strong {
            color: var(--text-accent);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .insight-box p {
            margin: 0;
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.4;
        }

        /* Code Editor Window */
        .code-window {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .code-titlebar {
            background: #0b0f19;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .code-controls {
            display: flex;
            gap: 6px;
        }

        .code-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4b5563;
        }

        .code-dot.red { background: #ef4444; }
        .code-dot.yellow { background: #f59e0b; }
        .code-dot.green { background: #10b981; }

        .code-filepath {
            font-size: 12px;
            color: var(--text-secondary);
            font-family: 'Fira Code', monospace;
            font-weight: 500;
        }

        .code-content {
            padding: 16px;
            flex-grow: 1;
            font-family: 'Fira Code', monospace;
            font-size: 12.5px;
            line-height: 1.5;
            color: #cbd5e1;
            overflow-y: auto;
            white-space: pre;
        }

        /* Syntax Highlighting */
        .keyword { color: #f43f5e; font-weight: 600; }
        .class { color: #38bdf8; }
        .string { color: #10b981; }
        .comment { color: #64748b; font-style: italic; }
        .variable { color: #fb923c; }
        .function { color: #fb7185; }
        .tag { color: #f43f5e; }
        .attr { color: #a7f3d0; }

        /* Cover Page Layout */
        .cover-layout {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            height: 100%;
        }

        .cover-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--laravel-red-glow);
            color: var(--laravel-red);
            border: 1px solid var(--laravel-red-border);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .cover-title-main {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .cover-title-main span {
            color: var(--laravel-red);
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }

        .cover-subtitle {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 850px;
            margin-bottom: 35px;
        }

        .cover-meta {
            display: flex;
            gap: 40px;
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
            width: 100%;
        }

        .meta-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .meta-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .meta-val {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Folder Structure List */
        .folder-tree {
            font-family: 'Fira Code', monospace;
            font-size: 12.5px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .tree-node {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 6px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .tree-node:hover {
            background: var(--hover-bg);
        }

        .tree-node.highlight {
            background: var(--laravel-red-glow);
            border-left: 3px solid var(--laravel-red);
            color: var(--text-primary);
            font-weight: 600;
        }

        .tree-indent {
            margin-left: 16px;
            border-left: 1px dashed rgba(255, 255, 255, 0.12);
            padding-left: 10px;
        }

        /* Interactive Tabs for code views */
        .tab-bar {
            display: flex;
            background: #0b0f19;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .tab-btn {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            padding: 10px 14px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--laravel-red);
            border-bottom-color: var(--laravel-red);
            background: var(--code-bg);
            font-weight: 600;
        }

        /* Live Preview browser container */
        .browser-preview-frame {
            border-top: 1px solid var(--border-color);
            background: #f8fafc;
            color: #0f172a;
            padding: 14px;
            font-size: 13px;
            height: 140px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .browser-header {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: #475569;
            margin-bottom: 6px;
            font-family: sans-serif;
            flex-shrink: 0;
        }

        .browser-url-input {
            background: #ffffff;
            border-radius: 4px;
            padding: 2px 8px;
            flex-grow: 1;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            border: 1px solid #cbd5e1;
        }

        .browser-body {
            font-family: system-ui, sans-serif;
            flex-grow: 1;
        }

        /* Interactive Terminal Simulator */
        .terminal-actions {
            display: flex;
            gap: 10px;
            padding: 10px 16px;
            background: #111827;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .terminal-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .terminal-btn:hover:not(:disabled) {
            background: var(--laravel-red);
            border-color: var(--laravel-red);
        }

        .terminal-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Comparison Box Grid */
        .versus-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 10px;
        }

        .versus-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
        }

        .versus-box.highlight {
            background: var(--laravel-red-glow);
            border-color: var(--laravel-red-border);
        }

        .versus-box h4 {
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .versus-box h4 i {
            color: var(--laravel-red);
        }

        .versus-box ul {
            padding-left: 16px;
            list-style-type: disc;
        }

        .versus-box li {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 4px;
        }

        /* Bottom Control Bar */
        .control-bar {
            height: 64px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 45px;
            background: #030712;
            z-index: 10;
            flex-shrink: 0;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            background: var(--laravel-red);
            border-color: var(--laravel-red);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .slide-counter {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .selector-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .selector-container label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        select {
            background: #0f172a;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }

        select:focus {
            border-color: var(--laravel-red);
        }

        /* Top Progress Bar indicator */
        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 20;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--laravel-red) 0%, #fb7185 100%);
            transition: width 0.3s ease;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }

        /* Dependency mapping lines helper */
        .dependency-map-container {
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
        .dependency-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-accent);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dependency-flow {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
        }
        .flow-node {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--text-secondary);
        }
        .flow-node.highlight {
            background: var(--laravel-red-glow);
            border-color: var(--laravel-red-border);
            color: var(--text-primary);
            font-weight: 600;
        }
        .flow-arrow {
            color: var(--laravel-red);
            font-weight: 900;
        }

        /* Interactive Blade Variables customizer styles */
        .blade-playground-vars {
            display: flex;
            gap: 12px;
            padding: 10px 16px;
            background: #111827;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .playground-checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
        }
        .playground-select {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* HTTP ROUTE TESTER STYLES */
        .tester-inputs {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            background: #111827;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            align-items: center;
        }
        .tester-select {
            background: #1e293b;
            color: #10b981;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }
        .tester-select:focus {
            border-color: var(--laravel-red);
        }
        .tester-url-input {
            background: var(--code-bg);
            color: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12.5px;
            font-family: 'Fira Code', monospace;
            flex-grow: 1;
            outline: none;
        }
        .tester-url-input:focus {
            border-color: var(--laravel-red);
        }
        .tester-send-btn {
            background: var(--laravel-red);
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tester-send-btn:hover {
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
            filter: brightness(1.1);
        }
        .tester-results {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        .tester-headers-pane {
            background: #090d16;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .tester-response-pane {
            padding: 16px;
            flex-grow: 1;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 12.5px;
            color: #cbd5e1;
            background: var(--code-bg);
            white-space: pre-wrap;
        }

        /* Flow graph diagram step indicators */
        .flow-steps-bar {
            display: flex;
            gap: 10px;
            padding: 8px 16px;
            background: #0b0f19;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .flow-step-btn {
            background: #1e293b;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .flow-step-btn.active {
            background: var(--laravel-red);
            color: #fff;
            border-color: var(--laravel-red);
        }
    </style>
</head>
<body>

<div class="slide-viewport">
    <!-- Top Progress Bar -->
    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Generated Slides Container -->
    <div id="slides-wrapper" style="height: calc(100% - 64px); display: flex; flex-direction: column; justify-content: space-between;">
        <!-- Slides are dynamically loaded here -->
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="control-bar">
        <div class="nav-buttons">
            <button class="btn" id="prev-btn"><i class="fa-solid fa-chevron-left"></i> Previous</button>
            <button class="btn" id="next-btn">Next <i class="fa-solid fa-chevron-right"></i></button>
        </div>
        
        <span class="slide-counter" id="slide-counter-val">1 / 50</span>
        
        <div class="selector-container">
            <label for="slide-selector">Jump to:</label>
            <select id="slide-selector">
                <!-- Dropdown options populated dynamically -->
            </select>
        </div>
    </div>
</div>

<script>
    // Include the complete 50 slides dataset
    const slidesData = [
        // SECTION 1: AGENDA (1-2)

        // SECTION 2: WHY FRAMEWORK (3-7)
        {

            type: 'bullets',
            moduleTag: 'Frameworks',
            title: 'What is a Web Framework?',
            topicTitle: 'The Pre-Built Toolbox',
            bullets: [
                'Pre-built components: A framework is a software library that provides pre-built modules for common development tasks.',

    function sendRouteTest() {
        const method = document.getElementById('route-tester-method').value;
        const rawUrl = document.getElementById('route-tester-url').value.trim();
        const headersPane = document.getElementById('route-tester-headers');
        const responsePane = document.getElementById('route-tester-response');

        // Parse query params helper
        const urlParts = rawUrl.split('?');
        const path = urlParts[0];
        const queryString = urlParts[1] || '';

        // Router matcher simulation
        if (method === 'GET' && path === '/hello') {
            headersPane.innerHTML = `Status: <span style="color:#10b981;">200 OK</span><br>Content-Type: text/plain; charset=UTF-8`;
            responsePane.innerHTML = `Hello, Laravel!`;
        } else if (method === 'GET' && path.startsWith('/user/')) {
            const idSegment = path.substring(6);
            const isNumeric = /^[0-9]+$/.test(idSegment);
            
            if (isNumeric) {
                headersPane.innerHTML = `Status: <span style="color:#10b981;">200 OK</span><br>Content-Type: text/html; charset=UTF-8<br>Matched Route: /user/{id}`;
                responsePane.innerHTML = `<div style="border:1px solid #cbd5e1; border-radius:8px; padding:12px; background:#fff; color:#0f172a;">\n  <h4 style="font-weight:700;">Profile View</h4>\n  <p>User Account ID: ${idSegment}</p>\n</div>`;
            } else {
                // regex match error triggers 404
                headersPane.innerHTML = `Status: <span style="color:#ef4444;">404 Not Found</span><br>Content-Type: text/html; charset=UTF-8`;
                responsePane.innerHTML = `Sorry, the route parameter pattern did not pass the regex constraint ->where('id', '[0-9]+').`;
            }
        } else if (method === 'GET' && path === '/search') {
            // query parameters
            let term = 'empty';
            if (queryString.includes('term=')) {
                term = queryString.split('term=')[1].split('&')[0];
            }
            headersPane.innerHTML = `Status: <span style="color:#10b981;">200 OK</span><br>Content-Type: application/json; charset=UTF-8`;
            responsePane.innerHTML = JSON.stringify({
                search_term: decodeURIComponent(term),
                status: 'success',
                timestamp: Math.floor(Date.now() / 1000)
            }, null, 2);
        } else {
            headersPane.innerHTML = `Status: <span style="color:#ef4444;">404 Not Found</span><br>Content-Type: text/html; charset=UTF-8`;
            responsePane.innerHTML = `Route [${method} ${rawUrl}] not registered in routes/web.php.`;
        }
    }

    // Helper functions
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;")
            .replace(/&lt;\?php/g, '<span class="keyword">&lt;?php</span>')
            .replace(/class /g, '<span class="keyword">class </span>')
            .replace(/function/g, '<span class="keyword">function</span>')
            .replace(/return /g, '<span class="keyword">return </span>')
            .replace(/namespace/g, '<span class="keyword">namespace</span>')
            .replace(/use /g, '<span class="keyword">use </span>');
    }

    // Viewport Rescaling logic
    function resizeSlides() {
        const viewport = document.querySelector('.slide-viewport');
        if (!viewport) return;
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;
        
        const buffer = 40;
        const scaleX = (windowWidth - buffer) / 1280;
        const scaleY = (windowHeight - buffer) / 720;
        
        const scale = Math.min(scaleX, scaleY, 1);
        viewport.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeSlides);
    window.addEventListener('load', resizeSlides);

    // Slide Swapper controller
    function showSlide(index) {
        if (index < 0 || index >= totalSlides) return;
        currentSlide = index;
        renderSlide(index);
        
        // Update control labels
        document.getElementById('slide-counter-val').textContent = (currentSlide + 1) + ' / ' + totalSlides;
        const progressPercent = ((currentSlide + 1) / totalSlides) * 100;
        document.getElementById('progress-bar').style.width = progressPercent + '%';
        document.getElementById('slide-selector').value = currentSlide;
        
        document.getElementById('prev-btn').disabled = (currentSlide === 0);
        document.getElementById('next-btn').disabled = (currentSlide === totalSlides - 1);
    }

    // Bind navigation buttons
    document.getElementById('prev-btn').addEventListener('click', () => {
        if (currentSlide > 0) showSlide(currentSlide - 1);
    });

    document.getElementById('next-btn').addEventListener('click', () => {
        if (currentSlide < totalSlides - 1) showSlide(currentSlide + 1);
    });

    document.getElementById('slide-selector').addEventListener('change', (e) => {
        showSlide(parseInt(e.target.value));
    });

    // Keyboard bindings
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault();
            if (currentSlide < totalSlides - 1) showSlide(currentSlide + 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'Backspace') {
            e.preventDefault();
            if (currentSlide > 0) showSlide(currentSlide - 1);
        }
    });

    // Initialize presentation
    showSlide(0);
    resizeSlides();
